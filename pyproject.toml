[project]
name = "flight-booking"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mohit Kumar Singh", email = "mohit.singh.ectech@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.1",
    "google-genai>=2.25.0",
    "langgraph>=1.2.12",
    "mcp[cli]>=2.3.0",
    "openai>=3.22.1",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
flight-booking = "flight_booking:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
